name: Monthly Bitmovin Report

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Target Year (e.g. 2026)'
        required: false
      month:
        description: 'Target Month (1-12)'
        required: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      BITMOVIN_API_KEY: ${{ secrets.BITMOVIN_API_KEY }}
      BITMOVIN_ORG_ID: ${{ secrets.BITMOVIN_ORG_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install requests pandas
      - run: |
          if [ -n "${{ inputs.year }}" ] && [ -n "${{ inputs.month }}" ]; then
            python bitmovin_report.py --year ${{ inputs.year }} --month ${{ inputs.month }}
          else
            python bitmovin_report.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bitmovin-transcoding-report
          path: bitmovin_transcoding_report_*.csv
          if-no-files-found: error
      - name: Commit report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f bitmovin_transcoding_report_*.csv
          git diff --cached --quiet || git commit -m "chore: add monthly Bitmovin report $(date +'%Y-%m')"
          git push